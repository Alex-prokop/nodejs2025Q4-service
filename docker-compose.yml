version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-library-app
    command: npm run start:dev
    ports:
      - '${PORT:-4000}:4000'
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: always
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
