# version: '3.9'
services:
  app:
    image: alexprokop7/home-library:latest
    container_name: home-library-app-hub
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - '${PORT:-4000}:4000'
    restart: always
    networks:
      - app-net

  db:
    image: postgres:16-alpine
    container_name: home-library-db-hub
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pglogs:/var/log/postgresql
    restart: always
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
  pglogs:
